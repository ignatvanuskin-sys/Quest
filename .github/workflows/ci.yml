name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Format check
        run: npm run format:check

      # Информационно: у next@14.2.x есть открытые advisory, закрытые только
      # в 15.5.26+/16.x (мажорный апгрейд, отдельная задача). Не блокируем CI,
      # чтобы не маскировать регрессы под шумом известных проблем.
      - name: Dependency audit (informational)
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://qwest-scary.vercel.app
